[package]
name = "client-wasm"
version = "0.1.0"
edition = "2021"
license = "BUSL-1.1"
description = "WebAssembly bridge and benchmark for mental-poker reconstruction proofs"
readme = "README.md"
repository = "https://github.com/linqining/poker_protocol"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
poker_protocol = { path = "../poker_protocol", features = ["borsh"] }
poker-protocol-core = { path = "../poker-protocol-core" }
poker-protocol-proofs = { path = "../poker-protocol-proofs", features = ["borsh"] }
borsh = "1.5"
wasm-bindgen = "0.2"
js-sys = "0.3"
rand_core = { version = "0.6.4", features = ["getrandom"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
