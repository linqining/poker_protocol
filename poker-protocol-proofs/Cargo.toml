[package]
name = "poker-protocol-proofs"
version = "0.1.0"
edition = "2021"
license = "BUSL-1.1"
description = "Complete proof suite for the mental-poker protocol"

[features]
# Never enabled in production: a no-op feature declaration so the
# `skip-prover` cfg gate on the prover entry points (used by the
# poker-protocol-aeneas extraction crate, which compiles this crate's
# pk_ownership.rs via #[path] under its own identically-named feature)
# passes cargo's check-cfg lint.
skip-prover = []
# Never enabled in production: no-ops the `dleq_reject_log!` diagnostics in
# extraction builds (see pk_ownership/dleq_proof sources).
skip-tracing = []
borsh = [
    "dep:borsh",
    "poker-protocol-core/borsh",
    "poker-protocol-core/stark-backend",
    "poker-protocol-bg/borsh",
]

[dependencies]
poker-protocol-core = { path = "../poker-protocol-core" }
poker-protocol-bg = { path = "../poker-protocol-bg" }
rand_core = "0.6.4"
rand = "0.8.5"
rayon = "1.10"
lazy_static = "1.4.0"
sha3 = "0.10.8"
merlin = "3"
tracing = "0.1"
borsh = { version = "1.5", optional = true }

[dev-dependencies]
curve25519-dalek = { version = "4.1.3", features = ["rand_core"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
halo2curves = { version = "0.7", default-features = false }
serde_json = "1"
sha2 = "0.10"
rand_chacha = "0.3"
